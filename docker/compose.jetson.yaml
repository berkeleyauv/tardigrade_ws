services:
  tardigrade:
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    environment:
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ZED_DIR: /usr/local/zed
      CUDA_TOOLKIT_ROOT_DIR: /usr/local/cuda
      CMAKE_PREFIX_PATH: /usr/local/zed
      LD_LIBRARY_PATH: /usr/local/zed/lib:/usr/local/cuda/lib64:/usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu
      LIBRARY_PATH: /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu
    volumes:
      # Provides ZED, VectorNav, ESP32, and other USB/serial devices inside
      # the container, including /dev/ttyUSB*, /dev/ttyACM*, and
      # /dev/serial/by-id/*.
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/argus_socket:/tmp/argus_socket
      - /usr/local/zed:/usr/local/zed
      - /usr/local/cuda:/usr/local/cuda
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra:ro
