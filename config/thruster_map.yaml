# Tardigrade physical thruster map.
#
# This file is the source of truth for the robot's actual wiring and geometry.
# The current ROS teleop path does not read this file yet: ROS publishes desired
# body motion on /tardigrade/cmd_vel, and PX4 maps that motion to actuator
# outputs. Keep this file updated so the PX4 actuator setup and future ROS-side
# allocation code can agree on the same physical robot.

schema_version: 1

vehicle_frame:
  convention: "ROS body FLU"
  x_positive: "forward / bow"
  y_positive: "left / port"
  z_positive: "up"
  origin: "TODO: center of mass or chosen vehicle reference point"

setup_notes:
  pixhawk_outputs: "Use MAIN1..MAIN8 or AUX1..AUX8 exactly as wired."
  positive_command: "Direction produced by a positive motor test command."
  px4_save_issue: "The bench Pixhawk currently cannot save params; actuator changes may need to be reapplied after reboot."
  ros_usage: "mavlink_pixhawk_interface sends body-frame velocity setpoints; PX4 currently performs actuator mixing."

verification:
  last_verified_date: "TODO"
  verified_by: "TODO"
  qgc_actuator_test_used: false
  notes: "TODO"

