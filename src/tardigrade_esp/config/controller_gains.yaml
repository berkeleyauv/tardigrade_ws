# Robosub control gains — THE SOURCE OF TRUTH.
#
# Loaded by depth_attitude_controller in both the simulator and on the real
# robot, so a tune done in sim transfers verbatim. Edit gains live through the
# Foxglove Service Call panels during a session, then land the final values
# HERE and commit — the running node's params reset on next launch.
#
# See docs/jetson_control_architecture.md and docs/pool_teleop.md for the
# current Jetson-side tuning process. The firmware PID guide is transitional
# and is not the control path used by these gains.

depth_attitude_controller:
  ros__parameters:
    # topics
    input_cmd_topic: /tardigrade/cmd_vel/manual
    output_cmd_topic: /tardigrade/cmd_vel
    enable_topic: /tardigrade/teleop/enabled
    odometry_topic: /tardigrade/state/odometry/filtered
    depth_target_topic: /tardigrade/depth_target
    control_rate_hz: 20.0
    cmd_timeout_sec: 0.5
    enable_timeout_sec: 0.25
    odometry_timeout_sec: 0.3

    # depth hold (metres / normalized heave)
    depth_kp: 0.8
    depth_ki: 0.0
    depth_kd: 0.25
    depth_integral_limit: 0.3
    depth_deadband_m: 0.02
    max_heave_command: 0.20

    # attitude hold (radians / normalized torque)
    roll_kp: 0.8
    roll_ki: 0.0
    roll_kd: 0.15
    pitch_kp: 0.8
    pitch_ki: 0.0
    pitch_kd: 0.15
    yaw_kp: 0.7
    yaw_ki: 0.0
    yaw_kd: 0.12
    attitude_integral_limit: 0.25
    max_roll_command: 0.20
    max_pitch_command: 0.20
    max_yaw_command: 0.20

    # Pool-test safety: enable one loop at a time through
    # /tardigrade/control/set_axes_enabled after validating its sensor signs.
    enable_roll: false
    enable_pitch: false
    enable_yaw: false
    enable_depth: false
    capture_initial_attitude_target: true

thruster_mixer:
  ros__parameters:
    wrench_topic: /tardigrade/cmd_vel
    output_topic: /tardigrade/thrusters/cmd
    publish_rate_hz: 20.0
    cmd_timeout_sec: 0.5
