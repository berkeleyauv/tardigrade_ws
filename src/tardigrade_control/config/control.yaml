# Shared physical-unit control configuration for simulation and hardware.
# Initial values are estimates and must be replaced with pool-fitted gains.

velocity_setpoint_mux:
  ros__parameters:
    publish_rate_hz: 50.0
    command_timeout_sec: 0.5
    frame_id: base_link

pose_velocity_controller:
  ros__parameters:
    control_rate_hz: 20.0
    setpoint_timeout_sec: 1.0
    odometry_timeout_sec: 0.25
    position.kp: [0.6, 0.6, 0.7]
    position.max_velocity: [0.5, 0.4, 0.3]
    attitude.kp: [0.8, 0.8, 1.0]
    attitude.max_rate: [0.4, 0.4, 0.5]

velocity_wrench_controller:
  ros__parameters:
    control_rate_hz: 50.0
    setpoint_timeout_sec: 0.5
    odometry_timeout_sec: 0.25
    allocation_status_timeout_sec: 0.25
    hold_depth_when_heave_zero: true
    depth_position_kp_n_per_m: 80.0
    antiwindup_gain: 0.5
    derivative_filter_alpha: 0.2
    # Enable only after the hydrodynamic coefficients are fitted.
    enable_drag_feedforward: false

    surge.kp: 45.0
    surge.ki: 3.0
    surge.kd: 3.0
    surge.integral_limit: 20.0
    surge.output_limit: 80.0
    sway.kp: 55.0
    sway.ki: 3.0
    sway.kd: 4.0
    sway.integral_limit: 20.0
    sway.output_limit: 80.0
    heave.kp: 65.0
    heave.ki: 5.0
    heave.kd: 5.0
    heave.integral_limit: 20.0
    heave.output_limit: 120.0
    roll.kp: 10.0
    roll.ki: 0.5
    roll.kd: 1.5
    roll.integral_limit: 20.0
    roll.output_limit: 20.0
    pitch.kp: 12.0
    pitch.ki: 0.5
    pitch.kd: 1.8
    pitch.integral_limit: 20.0
    pitch.output_limit: 20.0
    yaw.kp: 14.0
    yaw.ki: 0.8
    yaw.kd: 2.0
    yaw.integral_limit: 20.0
    yaw.output_limit: 25.0

thruster_allocator:
  ros__parameters:
    publish_rate_hz: 50.0
    command_timeout_sec: 0.25
    feasible_residual_tolerance: 0.25

thruster_actuator_mapper:
  ros__parameters:
    voltage_scale: 1.0
    command_timeout_sec: 0.25
