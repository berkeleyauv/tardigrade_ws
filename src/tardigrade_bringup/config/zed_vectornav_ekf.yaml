ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # ZED visual odometry supplies local position and, when available, linear
    # velocity. Orientation is intentionally left to the VectorNav.
    odom0: /zed/zed_node/odom
    odom0_config: [
      true,  true,  true,
      false, false, false,
      true,  true,  true,
      false, false, false,
      false, false, false
    ]
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 2.0

    # VectorNav supplies attitude and angular velocity. Linear acceleration is
    # not fused yet; it needs careful calibration and gravity handling first.
    imu0: /vectornav/imu
    imu0_config: [
      false, false, false,
      true,  true,  true,
      false, false, false,
      true,  true,  true,
      false, false, false
    ]
    imu0_queue_size: 20
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_pose_rejection_threshold: 0.8
    imu0_twist_rejection_threshold: 1.5

